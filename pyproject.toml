[project]
name = "stock-dictionary-pipeline"
version = "0.1.0"
description = "Stock dictionary scraping and export pipeline"
requires-python = ">=3.12"
dependencies = [
  "scrapling[all]==0.4.8",
  "langchain==1.2.18",
  "langchain-core==1.4.0",
  "langgraph==1.1.10",
  "langchain-google-genai==4.2.2",
  "pydantic==2.13.4",
  "python-dotenv==1.2.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
